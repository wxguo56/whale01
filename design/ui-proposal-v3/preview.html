function keyboardVisible(){return state.keyboard&&state.screen!=="voice"&&(composerScreens.includes(state.screen)||["reminder","preferences","region"].includes(state.modal));}
function sheetWrap(title,body,actions=""){return `<div class="overlay ${keyboardVisible()?"keyboard-up":""}" role="dialog" aria-modal="true" aria-label="${title}"><button class="sheet-backdrop" data-action="close-modal" aria-label="关闭弹层"></button><section class="sheet"><div class="sheet-handle"></div><header class="sheet-header"><h2>${title}</h2><button class="icon-button" data-action="close-modal" aria-label="关闭弹层">${icon("close")}</button></header><div class="sheet-body">${body}</div>${actions?`<div class="sheet-actions">${actions}</div>`:""}</section></div>`;}
function reminderSheet(){const event=state.confirmType==="event";const d=state.confirmDraft||(state.saved&&state.editing?state.saved:{title:event?"健身":"取快递",date:"2026-11-10",time:event?"18:00":"15:00",end:event?"19:00":""});return sheetWrap(state.editing?"调整安排":event?"安排日程":"创建提醒",`<p class="sheet-subtitle">把时间和事项核对一下。</p><label class="field">事项<input id="reminderTitle" value="${esc(d.title)}" maxlength="80"></label><div class="field-row"><label class="field">日期<input id="reminderDate" type="date" value="${esc(d.date)}"></label><label class="field">${event?"开始时间":"提醒时间"}<input id="reminderTime" type="time" value="${esc(d.time)}"></label></div>${event?`<label class="field">结束时间<input id="reminderEnd" type="time" value="${esc(d.end||"19:00")}"></label>`:""}<p class="sheet-disclaimer">${icon("shield")}保存到系统${event?"日历":"提醒事项"}。修改参数后，将按新的内容执行。</p>`,`<button class="primary-button" data-action="confirm-reminder">${state.editing?"保存修改":event?"确认安排":"确认创建"}</button><button class="text-button" data-action="cancel-reminder">取消这次安排</button>`);}
function mapArt(){return `<svg viewBox="0 0 360 150" aria-hidden="true"><rect width="360" height="150" fill="#e7eef7"/><path d="M0 45h360M0 104h360M85 0v150m160-150v150" stroke="#fff" stroke-width="16"/><path d="M-20 140 180-10" stroke="#b6d6c7" stroke-width="30"/><path d="M85 127V45h157v47" stroke="#6089d6" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="85" cy="128" r="7" fill="#5982d3" stroke="white" stroke-width="3"/><circle cx="245" cy="94" r="11" fill="#2f67d8" stroke="white" stroke-width="4"/></svg>`;}
function modalView(){
  const p=places[state.selectedPlace];
  if(state.modal==="reminder")return reminderSheet();
  if(state.modal==="place")return sheetWrap(p.name,`<p class="sheet-subtitle">${p.category} · ${state.locationMode==="current"?"距你":"距地区中心"}${p.distance}</p><div class="map-preview">${mapArt()}</div><p class="sheet-source-row"><strong>${p.address}</strong>直线距离 · ${p.distance}</p><p class="sheet-source-row"><strong>${p.price?`参考人均 ¥${p.price}`:"价格暂未查到"}</strong>${p.source}</p>`,`<button class="primary-button" data-action="open-map">${icon("pin")}交给地图，步行前往</button>`);
  if(state.modal==="source")return sheetWrap("价格来源",`<p class="sheet-subtitle">${p.name} · ${p.address}</p><div class="sheet-source-row"><strong>${p.price?`参考人均 ¥${p.price}`:"价格未知"}</strong>${p.source}</div><div class="sheet-source-row"><strong>取得时间</strong>11月9日 · 示例资料</div><p class="subtle-note">单品、套餐和人均分别比较。价格可能变化，以门店实际菜单为准。</p>`);
  if(state.modal==="attachment")return sheetWrap("添加内容",`<p class="sheet-subtitle">发来想一起看或整理的内容。</p><div class="upload-grid">${[["image","图片"],["doc","文件"],["chat","文本"]].map(([i,t])=>`<button class="upload-choice" data-action="content">${icon(i)}${t}</button>`).join("")}</div><p class="subtle-note">分享后可以总结，也可以选择需要安排的事项。</p>`);
  if(state.modal==="preferences")return sheetWrap("记住的小习惯",`<p class="sheet-subtitle">随时修改，或清空后删除。</p><label class="field">偏好，用逗号分开<input id="preferencesInput" value="${esc(state.prefs.join("，"))}" maxlength="160"></label><p class="subtle-note">只在相关任务中参考，不代表自动执行授权。</p>`,`<button class="primary-button" data-action="save-preferences">保存偏好</button>`);
  if(state.modal==="import")return sheetWrap("选取音频文件",`<p class="sheet-subtitle">选择你拥有的本地音频，加入鲸鱼曲库。</p>${tracks.map((t,i)=>`<div class="track-row"><span class="track-thumb">${album(i)}</span><span class="track-info"><strong>${t.title}.mp3</strong><small>${t.duration} · 示例文件</small></span>${icon("check")}</div>`).join("")}`,`<button class="primary-button" data-action="finish-import">加入曲库 · 3首</button>`);
  if(state.modal==="library-help")return sheetWrap("音乐来源",`<div class="sheet-source-row"><strong>系统“音乐”资料库</strong>需要资料库中有歌曲，并允许音乐访问。</div><div class="sheet-source-row"><strong>自己选取的音频文件</strong>文件导入能力启用后，可以加入鲸鱼曲库。</div><p class="subtle-note">其他音乐App下载的缓存通常不能直接读取。</p>`);
  if(state.modal==="permissions")return sheetWrap("能力与授权",`${[["日历与提醒","使用时申请"],["音乐库","使用时申请"],["当前位置",state.locationAllowed?"已允许（示例）":"尚未允许"],["麦克风","开启语音时申请"]].map(([a,b])=>`<div class="sheet-source-row"><strong>${a}</strong>${b}</div>`).join("")}<p class="subtle-note">拒绝一项权限，只影响需要它的功能。</p>`);
  if(state.modal==="routine")return sheetWrap("早间带伞提醒",`<div class="sheet-source-row"><strong>${state.routinePaused?"已暂停":"每天 08:00"}</strong>按保存的时区运行</div><div class="sheet-source-row"><strong>杭州天气</strong>有雨时通知你带伞</div><p class="subtle-note">每次运行保留结果。天气和通知不可用时说明失败。</p>`,`<button class="primary-button" data-action="routine-pause">${state.routinePaused?"恢复这个服务":"暂停这个服务"}</button>`);
  if(state.modal==="style")return sheetWrap("回复风格",`<p class="sheet-subtitle">用你舒服的方式交流。</p>${[["简洁自然","先说重点，需要时再展开。"],["详细解释","适合阅读、比较和学习。"]].map(([name,description])=>`<button class="setting-row" data-action="choose-style" data-style="${name}"><span><strong>${name}</strong><small class="subtle-note" style="display:block;margin:4px 0">${description}</small></span>${state.replyStyle===name?icon("check"):""}</button>`).join("")}`);
  if(state.modal==="region")return sheetWrap("指定地区",`<p class="sheet-subtitle">可以不使用设备定位。</p><label class="field">地区<input id="regionInput" value="杭州某地区" maxlength="80"></label>`,`<button class="primary-button" data-action="search-region">按这个地区找店</button>`);
  return "";
}
function render(){
  const voice=state.screen==="voice",keyboardOn=keyboardVisible();const view=({home:homeView,chat:chatView,voice:voiceView,music:musicView,records:recordsView,profile:profileView,content:contentView,confirm:chatView,permission:permissionView,unknown:unknownView,"empty-music":emptyMusicView})[state.screen]||homeView;
  const phone=$("#phone");phone.dataset.theme=state.theme;phone.classList.toggle("large-text",state.large);
  $("#app").innerHTML=header()+`<main class="app-content">${view()}</main>`+(voice?voiceFooter():"")+(!voice&&state.musicStarted&&state.screen!=="music"&&!keyboardOn?miniPlayer():"")+(composerScreens.includes(state.screen)?composer():"")+(!voice&&!keyboardOn?tabbar():"")+(keyboardOn?keyboard():"")+modalView()+(state.toast?`<div class="toast" role="status">${esc(state.toast)}</div>`:"");
  [...$("#app").children].forEach(child=>{child.inert=Boolean(state.modal)&&!child.classList.contains("overlay")&&!child.classList.contains("keyboard-mock")&&!child.classList.contains("toast");});
  const spec=screens.find(s=>s.id===state.screen);$("#currentScreenLabel").textContent=spec.label;$("#inspectorTitle").textContent=spec.title;$("#inspectorDescription").textContent=spec.description;$("#inspectorDetails").innerHTML=spec.details.map(([t,d])=>`<div class="design-detail"><strong>${t}</strong><p>${d}</p></div>`).join("");
  $("#screenNav").innerHTML=screens.map(s=>`<button class="screen-nav-button ${s.id===state.screen?"active":""}" data-preview="${s.id}" ${s.id===state.screen?'aria-current="page"':""}>${icon(s.icon)}${s.label}</button>`).join("");
  $("#themeSelect").value=state.theme;$("#largeText").checked=state.large;$("#keyboardToggle").checked=state.keyboard;
}
function sendMessage(){if(!state.draft.trim()){navigate("voice");return;}state.userText=state.draft.trim();state.draft="";state.chatMode="text";navigate("chat");}
function beginReminder(type="reminder",editing=false,draft=null){state.confirmType=type;state.editing=editing;state.confirmDraft=draft||(editing&&state.saved?{...state.saved}:null);state.modal="reminder";render();}
document.addEventListener("click",event=>{
  const preview=event.target.closest("[data-preview]");if(preview){const page=preview.dataset.preview;if(page==="chat"){state.chatMode="places";state.locationMode="current";state.budgetFilter=false;state.userText="找附近两公里烧烤，看看价格。";}if(page==="confirm"){state.confirmType="reminder";state.editing=false;}navigate(page);return;}
  const button=event.target.closest("[data-action]");if(!button||button.disabled)return;const action=button.dataset.action;
  if(action==="tab"){navigate(button.dataset.screen);return;}
  if(action==="history-back"||action==="history-forward"){historyMove(action==="history-back"?"back":"forward");return;}
  if(action==="exit-page"||action==="exit-voice"){navigate("home");return;}
  if(action==="voice"){navigate("voice");return;}
  if(action==="nearby"||action==="search-region"){state.chatMode="places";state.budgetFilter=false;state.locationMode=action==="search-region"?"region":"current";state.regionLabel=action==="search-region"?$("#regionInput").value||"指定地区":"";state.userText=action==="search-region"?`在${state.regionLabel}找烧烤。`:"找附近两公里烧烤，看看价格。";navigate("chat");return;}
  if(action==="music"){navigate("music");return;}
  if(action==="records"||action==="content"||action==="permission"||action==="unknown"){navigate(action);return;}
  if(action==="reminder"){beginReminder();return;}
  if(action==="event"){beginReminder("event",true,{title:"健身",date:"2026-11-10",time:"18:00",end:"19:00"});return;}
  if(action==="edit-saved"){beginReminder(state.saved?.end?"event":"reminder",true);return;}
  if(action==="content-reminder"){beginReminder("reminder",false,{title:"报名摄影分享会",date:"2026-11-13",time:"18:00",end:""});return;}
  if(action==="source"||action==="place"){state.selectedPlace=Number(button.dataset.place);state.modal=action;render();return;}
  if(action==="close-modal"){state.modal=null;if(state.screen==="confirm")navigate("home");else render();return;}
  if(action==="attachment"||action==="preferences"||action==="import"||action==="library-help"||action==="permissions"||action==="routine"||action==="style"){state.modal=action;render();return;}
  if(action==="manual-region"){state.modal="region";render();return;}
  if(action==="allow-location"){state.locationAllowed=true;state.locationMode="current";state.budgetFilter=false;state.chatMode="places";navigate("chat");return;}
  if(action==="cancel-task"||action==="cancel-reminder"){state.modal=null;navigate("home");toast("这次安排已取消");return;}
  if(action==="confirm-reminder"){
    const title=$("#reminderTitle").value.trim(),date=$("#reminderDate").value,time=$("#reminderTime").value,end=$("#reminderEnd")?.value||"";
    if(!title||!date||!time||(state.confirmType==="event"&&(!end||end<=time))){const note=document.createElement("p");note.className="subtle-note";note.setAttribute("role","alert");note.textContent="请补齐事项和有效起止时间。";$(".sheet-actions").prepend(note);return;}
    state.saved={title,date,time,end};state.userText=state.editing?`把${title}调整到${date} ${time}。`:`${date} ${time}提醒我${title}。`;state.chatMode="reminder";navigate("chat");return;
  }
  if(action==="save-preferences"){state.prefs=$("#preferencesInput").value.split(/[，,]/).map(t=>t.trim()).filter(Boolean).slice(0,6);state.modal=null;render();toast("偏好已更新");return;}
  if(action==="choose-style"){state.replyStyle=button.dataset.style;state.modal=null;render();return;}
  if(action==="theme"){state.theme=state.theme==="light"?"dark":"light";render();return;}
  if(action==="toggle-play"){state.musicStarted=true;state.playing=!state.playing;render();return;}
  if(action==="select-track"||action==="next-track"||action==="prev-track"){state.track=action==="select-track"?Number(button.dataset.track):(state.track+(action==="next-track"?1:tracks.length-1))%tracks.length;state.musicStarted=true;state.playing=true;render();return;}
  if(action==="finish-import"){state.modal=null;navigate("music");toast("3首示例曲目已加入");return;}
  if(action==="open-map"){state.modal=null;render();toast("地点已交给地图 · 交接反馈示例");return;}
  if(action==="budget"){state.budgetFilter=!state.budgetFilter;render();return;}
  if(action==="routine-pause"){state.routinePaused=!state.routinePaused;render();return;}
  if(action==="mute"){state.muted=!state.muted;render();return;}
  if(action==="voice-step"){clearTimeout(voiceTimer);if(state.muted){state.muted=false;state.voice="listening";render();return;}if(state.voice==="listening"){state.voice="thinking";render();voiceTimer=setTimeout(()=>{if(state.screen==="voice"){state.voice="speaking";render();}},900);}else{state.voice="listening";render();}return;}
  if(action==="hide-keyboard"){state.keyboard=false;render();return;}
  if(action==="key"){state.draft+=button.dataset.key;render();return;}
  if(action==="send"){sendMessage();}
});
document.addEventListener("submit",event=>{if(event.target.id==="composerForm"){event.preventDefault();sendMessage();}});
document.addEventListener("input",event=>{if(event.target.id==="messageInput"){state.draft=event.target.value;const b=$("#sendButton");b.classList.toggle("send-button",!!state.draft);b.setAttribute("aria-label",state.draft?"发送消息":"开始语音");b.innerHTML=icon(state.draft?"arrow":"mic");}if(["reminderTitle","reminderDate","reminderTime","reminderEnd"].includes(event.target.id)){state.confirmDraft={title:$("#reminderTitle").value,date:$("#reminderDate").value,time:$("#reminderTime").value,end:$("#reminderEnd")?.value||""};}});
document.addEventListener("keydown",event=>{if(event.key==="Escape"&&state.modal){state.modal=null;render();}});
$("#themeSelect").addEventListener("change",event=>{state.theme=event.target.value;render();});
$("#largeText").addEventListener("change",event=>{state.large=event.target.checked;render();});
$("#keyboardToggle").addEventListener("change",event=>{state.keyboard=event.target.checked;render();});
function fitPreview(){const full=$("#scaleSelect").value==="full";const availableWidth=$(".preview-column").clientWidth;const heightScale=Math.max(.78,(innerHeight-172)/894);const scale=full?1:Math.min(1,(availableWidth-4)/422,heightScale);$("#phoneStage").style.setProperty("--preview-scale",scale.toFixed(3));}
$("#scaleSelect").addEventListener("change",fitPreview);window.addEventListener("resize",fitPreview);
if(state.screen==="confirm"){state.modal="reminder";state.chatMode="pending";state.userText="明天下午3点提醒我取快递。";}
render();fitPreview();

</script>
</body>
</html>
