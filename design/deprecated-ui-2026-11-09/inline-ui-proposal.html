  <script>
    (() => {
      const proposalRoot = document.getElementById('whale01-ui-proposal');
      const sampleTracks = [{ title: '海边散步', artist: '示例曲目 A' },{ title: '晨间微风', artist: '示例曲目 B' },{ title: '夜航', artist: '示例曲目 C' }];
      const icon = (name) => `<i data-lucide="${name}" aria-hidden="true"></i>`;
      const escapeText = (value) => String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
      const formatDue = (value) => { const [datePart,timePart] = value.split('T'); const dateParts = datePart.split('-'); return `${Number(dateParts[1])}月${Number(dateParts[2])}日 ${timePart}`; };
      const phoneControllers = new Map();
      const refreshIcons = () => { if (typeof lucide !== 'undefined') lucide.createIcons({ attrs: { width: 20, height: 20 } }); };
      const persist = (controller) => {
        if (!window.openai || typeof window.openai.setWidgetState !== 'function') return;
        const privateContent = {};
        phoneControllers.forEach((entry,key) => { privateContent[key] = { page: entry.state.page, track: entry.state.track, playing: entry.state.playing, started: entry.state.started }; });
        Promise.resolve(window.openai.setWidgetState({ modelContent: { project:'代号鲸鱼01', design: controller.phone.closest('[data-variant]').dataset.variant, page: controller.state.page }, privateContent })).catch(() => {});
      };
      const homeMarkup = (state,design) => {
        const hero = design === 'tide' ? `<div class="w01-hero"><div class="w01-avatar" aria-hidden="true">🐳</div><p class="w01-inline-note">陪你安排今天，也陪你听一首歌。</p></div>` : `<div class="w01-banner"><div class="w01-row w01-between"><span class="w01-section-title">继续刚才的安排</span><span class="w01-pill">待确认</span></div><p style="margin-top:10px">取快递 · 明天 15:00</p><button class="w01-secondary w01-wide cursor-interaction" style="margin-top:12px" data-page="chat">查看提醒</button></div>`;
        return `<div class="w01-stack"><div><h1 class="w01-heading">${design === 'tide' ? '你好，我是鲸鱼' : '今天，先做哪件事？'}</h1><p class="w01-subtitle">${design === 'tide' ? '有事交给我，没事聊一会儿。' : '安排、出行和音乐，一步就能开始。'}</p></div>${hero}<button class="w01-ask cursor-interaction" data-page="chat"><span><strong>今天需要我帮你做什么？</strong><small>文字输入，或开始语音对话</small></span>${icon('mic')}</button><div class="w01-summary-grid"><button class="w01-summary cursor-interaction" data-action="weather">${icon('cloud-sun')}<small>天气</small><strong>查看预报</strong></button><button class="w01-summary cursor-interaction" data-action="calendar">${icon('calendar-days')}<small>今日日程</small><strong>查看安排</strong></button><button class="w01-summary cursor-interaction" data-action="activity">${icon('activity')}<small>运动概览</small><strong>查看摘要</strong></button></div><div><div class="w01-section-title" style="margin-bottom:9px">现在想做什么</div><div class="w01-shortcuts"><button class="w01-shortcut cursor-interaction" data-page="chat">${icon('bell')}设置提醒</button><button class="w01-shortcut cursor-interaction" data-page="music">${icon('headphones')}我想听歌</button><button class="w01-shortcut cursor-interaction" data-action="places">${icon('map-pin')}附近地点</button><button class="w01-shortcut cursor-interaction" data-action="calendar">${icon('calendar-days')}查看日程</button></div></div><p class="w01-inline-note">设计稿 · 所有内容均为界面示例</p></div>`;
      };
      const chatMarkup = (state) => {
        const status = state.reminderCancelled ? '已取消' : state.reminderDone ? '已完成 · 预览' : '待确认';
        const actions = state.reminderCancelled ? `<button class="w01-secondary w01-wide cursor-interaction" data-action="restart-reminder">重新设置提醒</button>` : state.reminderDone ? `<p class="w01-inline-note">已演示创建流程，没有写入系统。</p>` : `<div class="w01-task-actions"><button class="w01-secondary cursor-interaction" data-action="cancel-reminder">取消</button><button class="w01-primary cursor-interaction" data-action="confirm-sheet">查看并确认</button></div>`;
        return `<div class="w01-stack w01-chat"><div class="w01-row w01-between"><h1 class="w01-section-title">与鲸鱼对话</h1><span class="w01-pill">${state.reminderCancelled ? '任务已取消' : state.reminderDone ? '处理完成' : '等待你的确认'}</span></div><div class="w01-stack w01-conversation"><p class="w01-message w01-user-message">明天下午三点提醒我取快递</p><p class="w01-message">我理解为明天 15:00。你可以先核对，确认后再创建。</p><div class="w01-task"><div class="w01-row w01-between"><span class="w01-section-title">${icon('bell')} 创建提醒</span><span class="w01-pill">${status}</span></div><div class="w01-task-lines"><div class="w01-row w01-between"><span class="w01-label">事项</span><span>${escapeText(state.reminderTitle)}</span></div><div class="w01-row w01-between"><span class="w01-label">时间</span><span>${formatDue(state.reminderDue)}</span></div><div class="w01-row w01-between"><span class="w01-label">时区</span><span>上海</span></div></div>${actions}</div>${state.notice ? `<p class="w01-message" role="status">${escapeText(state.notice)}</p>` : ''}<button class="w01-shortcut cursor-interaction" data-page="music">${icon('headphones')}我想听歌</button></div><form class="w01-composer" data-chat-form><input aria-label="对话输入" placeholder="说说你想做什么…" value="${escapeText(state.input)}"><button class="w01-secondary cursor-interaction" type="button" data-action="voice-preview" aria-label="语音输入预览">${icon('mic')}</button><button class="w01-primary cursor-interaction" type="submit" aria-label="发送消息">${icon('arrow-up')}</button></form><p class="w01-inline-note">左滑返回 · 右滑前进 · 仅演示交互</p></div>`;
      };
      const musicMarkup = (state) => {
        const track = sampleTracks[state.track];
        return `<div class="w01-stack"><div class="w01-row w01-between"><div><h1 class="w01-heading">我的音乐</h1><p class="w01-subtitle">从音乐库挑一首，交给鲸鱼。</p></div><span class="w01-pill">示例曲库</span></div><div class="w01-now-playing"><div class="w01-music-cover">${icon('audio-lines')}</div><div class="w01-track-title">${track.title}</div><p class="w01-label">${track.artist} · ${state.playing ? '播放状态预览' : '已暂停／待播放'}</p><input class="w01-progress" type="range" min="0" max="100" value="${state.progress}" aria-label="播放进度预览" data-no-swipe><div class="w01-player-controls w01-row"><button class="cursor-interaction" data-action="previous-track" aria-label="上一首">${icon('skip-back')}</button><button class="w01-play w01-primary cursor-interaction" data-action="toggle-play" aria-label="${state.playing ? '暂停' : '播放'}">${icon(state.playing ? 'pause' : 'play')}</button><button class="cursor-interaction" data-action="next-track" aria-label="下一首">${icon('skip-forward')}</button></div></div><div class="w01-row w01-between"><span class="w01-section-title">音乐库</span><span class="w01-label">3 首示例</span></div><div class="w01-library">${sampleTracks.map((entry,index) => `<button class="w01-track cursor-interaction" data-track="${index}" aria-label="选择${entry.title}"><span class="w01-track-art">${icon('music-2')}</span><span class="w01-track-text"><span>${entry.title}</span><span class="w01-caption" style="display:block">${entry.artist}</span></span>${icon(index === state.track ? 'check' : 'play')}</button>`).join('')}</div><p class="w01-inline-note">仅演示播放界面，不读取音乐库或播放音频。</p></div>`;
      };
      const settingsMarkup = (state) => `<div class="w01-stack"><div><h1 class="w01-heading">我的鲸鱼</h1><p class="w01-subtitle">能力由你授权，使用由你决定。</p></div><div class="w01-section-title">能力与授权</div><div class="w01-settings-group"><div class="w01-setting"><span>读取日历</span><small>按需授权</small></div><div class="w01-setting"><span>创建日程</span><small>按需授权</small></div><div class="w01-setting"><span>提醒事项</span><small>按需授权</small></div><div class="w01-setting"><span>运动数据</span><small>按需授权</small></div><div class="w01-setting"><span>音乐库</span><small>按需授权</small></div><div class="w01-setting"><span>定位</span><small>使用期间</small></div></div><div class="w01-section-title">语音与偏好</div><div class="w01-settings-group"><div class="w01-setting"><label>语音播报<input type="checkbox" aria-label="语音播报预览" ${state.voice ? 'checked' : ''}></label></div><div class="w01-setting"><span>音乐播放时</span><small>优先保持你的操作</small></div></div><div class="w01-settings-group"><div class="w01-setting"><span>数据说明</span><small>查看使用范围</small></div><div class="w01-setting"><span>页面手势</span><small>左返 · 右进</small></div></div><p class="w01-inline-note">权限状态是设计占位，不代表设备已授权。</p></div>`;
      const savedState = window.openai && window.openai.widgetState && window.openai.widgetState.privateContent;
      proposalRoot.querySelectorAll('.w01-phone').forEach((phone) => {
        const design = phone.dataset.design;
        const previous = savedState && savedState[design];
        const state = { page: ['home','chat','music','settings'].includes(previous && previous.page) ? previous.page : 'home', back: [], forward: [], track: Number.isInteger(previous && previous.track) && previous.track >= 0 && previous.track < sampleTracks.length ? previous.track : 0, playing: !!(previous && previous.playing), started: !!(previous && previous.started), progress: 25, reminderTitle:'取快递', reminderDue:'2026-11-10T15:00', reminderDone:false, reminderCancelled:false, input:'', notice:'', voice:true, sheet:false };
        const appearance = { radius:20, accent:'#286de4' };
        const controller = { phone,state };
        phoneControllers.set(design,controller);
        const main = phone.querySelector('[data-page-content]');
        const overlay = phone.querySelector('[data-confirm-overlay]');
        const render = () => {
          main.innerHTML = state.page === 'home' ? homeMarkup(state,design) : state.page === 'chat' ? chatMarkup(state) : state.page === 'music' ? musicMarkup(state) : settingsMarkup(state);
          phone.querySelectorAll('[data-page]').forEach(button => { if (button.closest('nav')) { if (button.dataset.page === state.page) button.setAttribute('aria-current','page'); else button.removeAttribute('aria-current'); } });
          phone.querySelector('[data-action="back"]').disabled = state.back.length === 0;
          phone.querySelector('[data-action="forward"]').disabled = state.forward.length === 0;
          const mini = phone.querySelector('[data-mini-player]');
          mini.hidden = !state.started || state.page === 'music';
          mini.innerHTML = state.started ? `<button class="cursor-interaction" data-page="music"><span>${sampleTracks[state.track].title}</span><span class="w01-caption" style="display:block">${state.playing ? '播放预览' : '已暂停'} · 示例音乐</span></button><button class="cursor-interaction" data-action="toggle-play" aria-label="${state.playing ? '暂停' : '播放'}">${icon(state.playing ? 'pause' : 'play')}</button>` : '';
          refreshIcons();
        };
        const navigate = (page) => { if (state.sheet || page === state.page) return; state.back.push(state.page); state.forward = []; state.page = page; render(); persist(controller); };
        const moveHistory = (direction) => { if (state.sheet) return; const from = direction === 'back' ? state.back : state.forward; const destination = direction === 'back' ? state.forward : state.back; if (!from.length) return; destination.push(state.page); state.page = from.pop(); render(); persist(controller); };
        const closeSheet = () => { state.sheet = false; overlay.hidden = true; phone.querySelector('.w01-shell').inert = false; phone.querySelector('[data-action="confirm-sheet"]')?.focus(); };
        const openSheet = () => {
          state.sheet = true; overlay.hidden = false; phone.querySelector('.w01-shell').inert = true;
          overlay.innerHTML = `<section class="w01-sheet" role="dialog" aria-modal="true" aria-label="创建提醒确认"><div class="w01-sheet-handle"></div><div class="w01-row w01-between"><div><h2>创建提醒</h2><p class="w01-label">执行前预览 · 尚未创建</p></div><button class="cursor-interaction" data-action="close-sheet" aria-label="关闭确认">${icon('x')}</button></div><label class="w01-field-label">事项<input aria-label="提醒事项" value="${escapeText(state.reminderTitle)}"></label><label class="w01-field-label">时间<input type="datetime-local" aria-label="提醒时间" value="${state.reminderDue}" required></label><div class="w01-row w01-between"><span>时区</span><span>上海（+08:00）</span></div><p class="w01-inline-note">核对后确认，才能执行。本次只演示界面。</p><div class="w01-task-actions"><button class="w01-secondary cursor-interaction" data-action="close-sheet">取消</button><button class="w01-primary cursor-interaction" data-action="confirm-create">确认创建</button></div></section>`;
          refreshIcons(); overlay.querySelector('input').focus();
        };
        phone.addEventListener('click',(event) => {
          const button = event.target.closest('button'); if (!button || button.disabled) return;
          if (button.dataset.page) return navigate(button.dataset.page);
          if (button.dataset.track !== undefined) { state.track = Number(button.dataset.track); state.started = true; state.playing = true; render(); persist(controller); return; }
          const action = button.dataset.action;
          if (action === 'back' || action === 'forward') return moveHistory(action);
          if (action === 'confirm-sheet') return openSheet();
          if (action === 'close-sheet') return closeSheet();
          if (action === 'confirm-create') { const titleField = overlay.querySelector('input[aria-label="提醒事项"]'); const dueField = overlay.querySelector('input[aria-label="提醒时间"]'); const title = titleField.value.trim(); if (!title) { titleField.setCustomValidity('请填写事项'); titleField.reportValidity(); return; } if (!dueField.reportValidity()) return; state.reminderTitle = title; state.reminderDue = dueField.value; state.reminderDone = true; state.reminderCancelled = false; closeSheet(); render(); persist(controller); return; }
          if (action === 'cancel-reminder') { state.notice = '已取消这次提醒预览，没有创建记录。'; state.reminderDone = false; state.reminderCancelled = true; render(); return; }
          if (action === 'restart-reminder') { state.reminderCancelled = false; state.reminderDone = false; state.notice = ''; render(); return; }
          if (action === 'toggle-play') { state.started = true; state.playing = !state.playing; render(); persist(controller); return; }
          if (action === 'previous-track' || action === 'next-track') { state.track = (state.track + (action === 'next-track' ? 1 : -1) + sampleTracks.length) % sampleTracks.length; state.started = true; render(); persist(controller); return; }
          if (action === 'voice-preview') { state.notice = '语音入口预览：可以说“我想听歌”。'; render(); return; }
          if (['weather','calendar','activity','places'].includes(action)) { state.notice = {weather:'天气结果在这里以卡片展示，未接入真实预报。',calendar:'日程结果在这里展示，缺少时间时保留任务并追问。',activity:'运动摘要与首页共用数据状态，不把无数据当作零。',places:'地点选择完成后，明确交接到地图，不声称已到达。'}[action]; navigate('chat'); render(); }
        });
        phone.addEventListener('input',(event) => { if (event.target.matches('[data-chat-form] input')) state.input = event.target.value; if (event.target.matches('.w01-progress')) state.progress = Number(event.target.value); if (event.target.matches('[data-confirm-overlay] input')) event.target.setCustomValidity(''); });
        phone.addEventListener('change',(event) => { if (event.target.matches('input[type="checkbox"]')) state.voice = event.target.checked; });
        phone.addEventListener('submit',(event) => { if (!event.target.matches('[data-chat-form]')) return; event.preventDefault(); const text = state.input.trim(); if (!text) return; state.input = ''; if (/听歌|音乐|播放/.test(text)) return navigate('music'); state.notice = '已收到：“' + text + '”。这是布局预览，实际任务由原生助手处理。'; render(); });
        phone.addEventListener('keydown',(event) => { if (event.key === 'Escape' && state.sheet) closeSheet(); });
        let gestureStart = null;
        phone.addEventListener('pointerdown',(event) => { if (state.sheet || event.target.closest('button,input,textarea,select,label,[data-no-swipe]')) return; gestureStart = { x:event.clientX,y:event.clientY }; });
        phone.addEventListener('pointerup',(event) => { if (!gestureStart) return; const deltaX = event.clientX - gestureStart.x; const deltaY = event.clientY - gestureStart.y; gestureStart = null; if (Math.abs(deltaX) >= 60 && Math.abs(deltaX) > Math.abs(deltaY) * 1.5) moveHistory(deltaX < 0 ? 'back' : 'forward'); });
        phone.addEventListener('pointercancel',() => { gestureStart = null; });
        controller.restore = (saved) => { if (!saved || state.sheet) return; if (['home','chat','music','settings'].includes(saved.page)) state.page = saved.page; if (Number.isInteger(saved.track) && saved.track >= 0 && saved.track < sampleTracks.length) state.track = saved.track; state.playing = !!saved.playing; state.started = !!saved.started; render(); };
        render();
        if (globalThis.Tweak) { const appearanceTweak = new Tweak({ container:phone,onChange:() => { phone.style.setProperty('--w01-radius',appearance.radius + 'px'); phone.style.setProperty('--w01-accent',appearance.accent); const hex = appearance.accent.replace('#',''); const luminance = (parseInt(hex.slice(0,2),16)*.299 + parseInt(hex.slice(2,4),16)*.587 + parseInt(hex.slice(4,6),16)*.114)/255; phone.style.setProperty('--w01-onaccent',luminance > .62 ? '#102139' : '#ffffff'); } }); appearanceTweak.addSlider(appearance,'radius',{label:'卡片圆角',min:12,max:28,unit:'px',reference:'--w01-radius'}); appearanceTweak.addColorPicker(appearance,'accent',{label:'强调色',reference:'--w01-accent'}); }
      });
      window.addEventListener('openai:set_globals',(event) => { const updated = event.detail && event.detail.globals && event.detail.globals.widgetState; if (!updated || !updated.privateContent) return; phoneControllers.forEach((controller,key) => controller.restore(updated.privateContent[key])); });
    })();
  </script>
</div>
