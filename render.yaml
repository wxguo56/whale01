services:
  - type: web
    name: whale01-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: MODEL_MODE
        value: deepseek
      - key: EXECUTION_MODE
        value: ios
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: WHALE_AUTH_TOKENS
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8787
