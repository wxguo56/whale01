  <header class="studio-header"><div><span class="studio-label">WHALE 01 / DESIGN PROPOSAL</span><h1>让对话成为日常的入口</h1><p>全新提案 · iPhone 16 Pro · 所有数据、语音与执行均为模拟</p></div><a class="studio-link" href="../capability-summary/index.html">查看完整能力说明 ↗</a></header>
