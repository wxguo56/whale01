name: iOS UI Snapshot

on:
  workflow_dispatch:

concurrency:
  group: ios-ui-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: Capture discover tab screenshots
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project WhaleAgent.xcodeproj \
            -scheme WhaleAgent \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            MARKETING_VERSION=0.6.2 \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            WHALE_API_TOKEN="${{ secrets.WHALE_API_TOKEN }}" \
            DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Boot simulator and capture screenshots
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | /usr/bin/python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; c=[x for rt in d.values() for x in rt if x["name"].startswith("iPhone")]; print(c[0]["udid"] if c else "")')
          test -n "$DEVICE_ID"
          echo "Using device $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" ios/build/Build/Products/Debug-iphonesimulator/WhaleAgent.app
          for service in reminders calendar photos microphone location contacts; do
            xcrun simctl privacy "$DEVICE_ID" grant "$service" com.whale01.agent || true
          done
          xcrun simctl location "$DEVICE_ID" set 30.2741,120.1551 || true
          SIMCTL_CHILD_WHALE_DEMO_DISCOVER=1 xcrun simctl launch "$DEVICE_ID" com.whale01.agent
          sleep 8
          mkdir -p snapshots
          xcrun simctl io "$DEVICE_ID" screenshot snapshots/discover.png
          xcrun simctl terminate "$DEVICE_ID" com.whale01.agent || true
          SIMCTL_CHILD_WHALE_DEMO_GAME=1 xcrun simctl launch "$DEVICE_ID" com.whale01.agent
          sleep 14
          xcrun simctl io "$DEVICE_ID" screenshot snapshots/game-detail.png
          xcrun simctl terminate "$DEVICE_ID" com.whale01.agent || true
          SIMCTL_CHILD_WHALE_DEMO_CHANNEL=ai xcrun simctl launch "$DEVICE_ID" com.whale01.agent
          sleep 14
          xcrun simctl io "$DEVICE_ID" screenshot snapshots/ai-channel.png
          xcrun simctl terminate "$DEVICE_ID" com.whale01.agent || true
          SIMCTL_CHILD_WHALE_DEMO_CHANNEL=headline xcrun simctl launch "$DEVICE_ID" com.whale01.agent
          sleep 14
          xcrun simctl io "$DEVICE_ID" screenshot snapshots/headline-channel.png
          xcrun simctl terminate "$DEVICE_ID" com.whale01.agent || true
          SIMCTL_CHILD_WHALE_DEMO_CHANNEL=game SIMCTL_CHILD_WHALE_DEMO_GAME_SECTION=steamTop xcrun simctl launch "$DEVICE_ID" com.whale01.agent
          sleep 16
          xcrun simctl io "$DEVICE_ID" screenshot snapshots/steam-top.png
          xcrun simctl terminate "$DEVICE_ID" com.whale01.agent || true
          SIMCTL_CHILD_WHALE_DEMO_WEATHER=1 xcrun simctl launch "$DEVICE_ID" com.whale01.agent
          sleep 16
          xcrun simctl io "$DEVICE_ID" screenshot snapshots/weather-detail.png
          xcrun simctl terminate "$DEVICE_ID" com.whale01.agent || true
          SIMCTL_CHILD_WHALE_DEMO_HOME=1 xcrun simctl launch "$DEVICE_ID" com.whale01.agent
          sleep 12
          xcrun simctl io "$DEVICE_ID" screenshot snapshots/home-weather-collapsed.png
          xcrun simctl terminate "$DEVICE_ID" com.whale01.agent || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-snapshot
          path: snapshots
          if-no-files-found: warn

      - name: Compress screenshots
        if: always()
        run: |
          mkdir -p snapshots-jpg
          for f in snapshots/*.png; do
            [ -e "$f" ] || continue
            sips -s format jpeg -s formatOptions 72 "$f" --out "snapshots-jpg/$(basename "${f%.png}").jpg" >/dev/null
          done

      - name: Upload compressed screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-snapshot-jpg
          path: snapshots-jpg
          if-no-files-found: warn
