name: iOS Sideload IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - "!ios/**/*.md"
      - ".github/workflows/ios-sideload-ipa.yml"

concurrency:
  group: ios-sideload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build unsigned device IPA for AltStore / SideStore
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Archive without signing
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project WhaleAgent.xcodeproj \
            -scheme WhaleAgentSideload \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/WhaleAgent.xcarchive \
          MARKETING_VERSION=0.5.0 \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            WHALE_API_TOKEN="${{ secrets.WHALE_API_TOKEN }}" \
            DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -200

      - name: Show compile errors
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/build.log"
          [ -f "$LOG" ] || exit 0
          {
            echo '### Compile errors'
            echo '```'
            grep -E "error:" "$LOG" | head -40 | sed -E 's/sk-[0-9a-fA-F]{16,}/[redacted]/g; s/whale-[a-z0-9]{8,}/[redacted]/g' | cut -c1-400
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Package unsigned IPA
        working-directory: ios
        run: |
          APP_PATH="$(ls -d build/WhaleAgent.xcarchive/Products/Applications/*.app | head -1)"
          test -n "$APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qry WhaleAgent-Sideload.ipa Payload
          unzip -l WhaleAgent-Sideload.ipa | head -20

      - name: Encrypt IPA for public storage
        working-directory: ios
        env:
          IPA_PASS: ${{ secrets.IPA_PASS }}
        run: |
          set -e
          if [ -z "$IPA_PASS" ]; then
            echo "::error::Missing IPA_PASS secret. Refusing to upload a plaintext IPA."
            exit 1
          fi
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in build/WhaleAgent-Sideload.ipa \
            -out build/WhaleAgent-Sideload.ipa.enc \
            -pass env:IPA_PASS
          shasum -a 256 build/WhaleAgent-Sideload.ipa > build/WhaleAgent-Sideload.sha256
          ls -l build/WhaleAgent-Sideload.ipa.enc

      - name: Verify binary architectures
        working-directory: ios
        run: |
          lipo -info build/Payload/WhaleAgent.app/WhaleAgent

      - name: Upload encrypted IPA
        uses: actions/upload-artifact@v4
        with:
          name: WhaleAgent-Sideload-ipa-enc
          path: |
            ios/build/WhaleAgent-Sideload.ipa.enc
            ios/build/WhaleAgent-Sideload.sha256

      - name: Show build identity
        working-directory: ios
        run: |
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Payload/WhaleAgent.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/Payload/WhaleAgent.app/Info.plist


