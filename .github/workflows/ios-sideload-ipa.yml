name: iOS Sideload IPA

on:
  workflow_dispatch:

concurrency:
  group: ios-sideload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build unsigned device IPA for AltStore / SideStore
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate source identity
        run: python3 tools/build_identity.py

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Archive without signing
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project WhaleAgent.xcodeproj \
            -scheme WhaleAgentSideload \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/WhaleAgent.xcarchive \
          MARKETING_VERSION=0.7.6 \
            CURRENT_PROJECT_VERSION="119.${{ github.run_attempt }}" \
            WHALE_API_TOKEN="${{ secrets.WHALE_API_TOKEN }}" \
            DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          APP_PATH="$(ls -d build/WhaleAgent.xcarchive/Products/Applications/*.app | head -1)"
          test -n "$APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qry WhaleAgent-Sideload.ipa Payload
          unzip -l WhaleAgent-Sideload.ipa | head -20

      - name: Verify candidate identity
        run: python3 tools/verify_ipa.py ios/build/WhaleAgent-Sideload.ipa --sha "$GITHUB_SHA"

      - name: Encrypt IPA for public storage
        working-directory: ios
        run: |
          set -e
          PASS_FILE="$(mktemp)"
          openssl rand -hex 32 > "$PASS_FILE"
          openssl enc -aes-256-cbc -pbkdf2 -salt -md sha256 \
            -in build/WhaleAgent-Sideload.ipa \
            -out build/WhaleAgent-Sideload.ipa.enc \
            -pass "file:$PASS_FILE"
          openssl rsautl -encrypt -pubin -inkey ../.github/ipa-public.pem -pkcs \
            -in "$PASS_FILE" \
            -out build/WhaleAgent-pass.enc
          rm -f "$PASS_FILE"
          shasum -a 256 build/WhaleAgent-Sideload.ipa > build/WhaleAgent-Sideload.sha256
          ls -l build/WhaleAgent-Sideload.ipa.enc build/WhaleAgent-pass.enc

      - name: Verify binary architectures
        working-directory: ios
        run: |
          lipo -info build/Payload/WhaleAgent.app/WhaleAgent

      - name: Upload encrypted IPA
        uses: actions/upload-artifact@v4
        with:
          name: WhaleAgent-Sideload-ipa-enc
          path: |
            ios/build/WhaleAgent-Sideload.ipa.enc
            ios/build/WhaleAgent-pass.enc
            ios/build/WhaleAgent-Sideload.sha256
            ios/build/WhaleAgent-Sideload.manifest.json

      - name: Show build identity
        working-directory: ios
        run: |
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Payload/WhaleAgent.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/Payload/WhaleAgent.app/Info.plist


