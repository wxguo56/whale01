name: iOS Simulator Build

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - "!ios/**/*.md"
      - ".github/workflows/ios-simulator-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - "!ios/**/*.md"
      - ".github/workflows/ios-simulator-build.yml"

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned simulator app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Inspect generated project
        working-directory: ios
        run: |
          xcodebuild -list -project WhaleAgent.xcodeproj
          xcodebuild -showsdks

      - name: Build for iOS Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project WhaleAgent.xcodeproj \
            -scheme WhaleAgent \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
          MARKETING_VERSION=0.4.9 \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            WHALE_API_TOKEN="${{ secrets.WHALE_API_TOKEN }}" \
            DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log

      - name: Run native unit tests
        working-directory: ios
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | /usr/bin/python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; c=[x for rt in d.values() for x in rt if x["name"].startswith("iPhone")]; print(c[0]["udid"] if c else "")')
          test -n "$DEVICE_ID"
          xcodebuild \
            -project WhaleAgent.xcodeproj \
            -scheme WhaleAgent \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build \
            test | tee test.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build-log
          path: |
            ios/build.log
            ios/test.log
          if-no-files-found: warn
