name: iOS Simulator Build

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - "!ios/**/*.md"
      - ".github/workflows/ios-simulator-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - "!ios/**/*.md"
      - ".github/workflows/ios-simulator-build.yml"

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned simulator app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Inspect generated project
        working-directory: ios
        run: |
          xcodebuild -list -project WhaleAgent.xcodeproj
          xcodebuild -showsdks

      - name: Build for iOS Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project WhaleAgent.xcodeproj \
            -scheme WhaleAgent \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            MARKETING_VERSION=0.2.0 \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build-log
          path: ios/build.log
          if-no-files-found: warn
