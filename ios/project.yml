name: WhaleAgent
options:
  bundleIdPrefix: com.whale01
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CURRENT_PROJECT_VERSION: "11"
    MARKETING_VERSION: "0.4.0"
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
targets:
  WhaleAgent:
    type: application
    platform: iOS
    sources:
      - path: WhaleAgent
        excludes:
          - "Info.plist"
          - "WhaleAgent.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whale01.agent
        PRODUCT_NAME: WhaleAgent
        INFOPLIST_FILE: WhaleAgent/Info.plist
        CODE_SIGN_ENTITLEMENTS: WhaleAgent/WhaleAgent.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: EventKit.framework
      - sdk: HealthKit.framework
      - sdk: MapKit.framework
      - sdk: CoreLocation.framework
      - sdk: Contacts.framework
      - sdk: MessageUI.framework
      - sdk: MusicKit.framework
      - sdk: WeatherKit.framework
      - sdk: Speech.framework
      - target: WhaleAgentShare
        embed: true
  WhaleAgentSideload:
    type: application
    platform: iOS
    sources:
      - path: WhaleAgent
        excludes:
          - "Info.plist"
          - "WhaleAgent.entitlements"
          - "WhaleAgent-Sideload.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whale01.whaleagent.alt
        PRODUCT_NAME: WhaleAgent
        INFOPLIST_FILE: WhaleAgent/Info.plist
        CODE_SIGN_ENTITLEMENTS: WhaleAgent/WhaleAgent-Sideload.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FREE_SIGNING"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: EventKit.framework
      - sdk: HealthKit.framework
      - sdk: MapKit.framework
      - sdk: CoreLocation.framework
      - sdk: Contacts.framework
      - sdk: MessageUI.framework
      - sdk: MusicKit.framework
      - sdk: WeatherKit.framework
      - sdk: Speech.framework
      - target: WhaleAgentShareSideload
        embed: true
  WhaleAgentShare:
    type: app-extension
    platform: iOS
    sources:
      - path: WhaleAgentShare
        excludes:
          - "Info.plist"
          - "WhaleAgentShare.entitlements"
          - "WhaleAgentShareSideload.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whale01.agent.share
        PRODUCT_NAME: WhaleAgentShare
        INFOPLIST_FILE: WhaleAgentShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: WhaleAgentShare/WhaleAgentShare.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        APPLICATION_EXTENSION_API_ONLY: YES
  WhaleAgentShareSideload:
    type: app-extension
    platform: iOS
    sources:
      - path: WhaleAgentShare
        excludes:
          - "Info.plist"
          - "WhaleAgentShare.entitlements"
          - "WhaleAgentShareSideload.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whale01.whaleagent.alt.share
        PRODUCT_NAME: WhaleAgentShare
        INFOPLIST_FILE: WhaleAgentShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: WhaleAgentShare/WhaleAgentShareSideload.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FREE_SIGNING"
        APPLICATION_EXTENSION_API_ONLY: YES
  WhaleAgentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WhaleAgentTests
    dependencies:
      - target: WhaleAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whale01.agent.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: WhaleAgent
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WhaleAgent.app/WhaleAgent"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  WhaleAgent:
    build:
      targets:
        WhaleAgent: all
        WhaleAgentTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WhaleAgentTests
    archive:
      config: Release
  WhaleAgentSideload:
    build:
      targets:
        WhaleAgentSideload: all
    run:
      config: Debug
    archive:
      config: Release
